<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            text-align: center;
            padding-top: 150px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 40px;
        }

        p {
            color: #b8c0d0;
            font-size: 18px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #4f8cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3b72d9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p>
            Analyze your resume and get an ATS score,
            detected skills and suggestions.
        </p>

        <button onclick="window.location.href='upload.html'">
            Analyze My Resume
        </button>

    </div>

</body>

</html>
